services:
  db:
    image: postgres:18-alpine
    environment: { POSTGRES_DB: booking, POSTGRES_USER: booking, POSTGRES_PASSWORD: booking }
    volumes: ["booking-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U booking -d booking"], interval: 5s, timeout: 5s, retries: 10 }
  app:
    build: .
    environment: { DATABASE_URL: "postgresql://booking:booking@db:5432/booking", DIRECT_URL: "postgresql://booking:booking@db:5432/booking" }
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { booking-data: {} }
